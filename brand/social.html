<!doctype html>
<!-- GitHub social preview (1280×640): shown when the repo link is shared. Render with headless Edge. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { background: radial-gradient(ellipse 70% 110% at 25% 45%, #3a2a17 0%, #1b1b1e 55%, #131315 100%);
         font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 0 90px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 44px; }
  img { width: 210px; height: 210px; }
  h1 { margin: 0; font-size: 104px; font-weight: 700; color: #f3f3f3; letter-spacing: -2px; line-height: 1; }
  h1 span { color: #f3b04f; }
  p { margin: 18px 0 0; font-size: 34px; color: #c4c4c4; line-height: 1.3; }
  small { display: block; margin-top: 16px; font-size: 24px; color: #e8a33d; letter-spacing: 3px; text-transform: uppercase; }
  .chips { display: flex; gap: 14px; margin-top: 46px; }
  .chips div { font-size: 24px; color: #e8e8e8; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 30px; padding: 10px 22px; }
</style></head><body>
  <div class="row">
    <img src="../build/logo.svg" alt="">
    <div>
      <h1>Light<span>bench</span></h1>
      <p>Photo library &amp; RAW editor with one-click AI masking</p>
      <small>by Latent Studios</small>
    </div>
  </div>
  <div class="chips"><div>True RAW</div><div>AI masks</div><div>AI Denoise</div><div>Runs offline</div><div>Windows &amp; Mac</div></div>
</body></html>
