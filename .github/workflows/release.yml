# Builds the Windows installer and the macOS disk images on GitHub's machines, then creates one
# GitHub Release (tag v<version from package.json>) with all of them attached.
# Trigger: Actions → Release → Run workflow (or push a tag like v1.0.1).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
            files: dist/*.exe
          - os: macos-latest          # Apple Silicon runner; also produces the Intel (x64) build
            target: --mac dmg --arm64 --x64   # both chips; naming the target alone would build only the runner's (Apple silicon)
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No Apple Developer certificate yet: the Mac app is ad-hoc signed ("identity": "-" in package.json), so macOS
          # asks users to allow it once (Privacy & Security → Open Anyway) instead of calling it "damaged".
          # With a certificate, remove "identity" and add CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v5
        with:
          name: installers-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    # Publish whatever built, so a slow/unavailable Mac runner never blocks the Windows release.
    # "Re-run failed jobs" later adds the Mac files to the same release.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lightbench ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md   # shown on the Releases page and in the app's "Update Available" window
          make_latest: true
          files: out/*
          fail_on_unmatched_files: true
