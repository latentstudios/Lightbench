<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightbench — Legal</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="">Lightbench<span class="by">by Latent Studios</span></a>
    <nav>
      <a href="legal.html?doc=LICENSE.txt">License</a>
      <a href="legal.html?doc=PRIVACY.md">Privacy</a>
      <a href="legal.html?doc=THIRD_PARTY_NOTICES.md">Credits</a>
      <a class="cta" href="index.html#download">Download</a>
    </nav>
  </div>
</header>
<main class="wrap legal" id="doc"><p>Loading…</p></main>
<footer><div class="wrap"><span>Lightbench is made by Latent Studios · © 2026 Latent Studios</span><nav><a href="index.html">Home</a></nav></div></footer>
<script>
// Renders the same legal documents that ship inside the app (copied to legal/ when the site is published).
(function () {
  const ALLOWED = ['LICENSE.txt', 'PRIVACY.md', 'THIRD_PARTY_NOTICES.md', 'Apache-2.0.txt', 'LibRaw-CDDL-1.0.txt', 'LibRaw-LGPL-2.1.txt', 'LibRaw-COPYRIGHT.txt',
    'CLIP-LICENSE.txt', 'Electron-LICENSE.txt', 'onnxruntime-LICENSE.txt', 'exifr-LICENSE.txt', 'Leaflet-LICENSE.txt'];
  const doc = new URLSearchParams(location.search).get('doc') || 'THIRD_PARTY_NOTICES.md';
  const box = document.getElementById('doc');
  if (!ALLOWED.includes(doc)) { box.textContent = 'Document not found.'; return; }
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2">$1</a>').replace(/&lt;(https?:[^&]+)&gt;/g, '<a href="$1">$1</a>');
  const linkFiles = (h) => h.replace(/<code>([\w.-]+\.(?:txt|md))<\/code>/g, (m, f) => (ALLOWED.includes(f) ? `<a href="legal.html?doc=${f}"><code>${f}</code></a>` : m));
  function md(src) {
    const out = [], lines = src.split(/\r?\n/);
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (/^#{1,3} /.test(l)) { const n = l.match(/^#+/)[0].length; out.push(`<h${n}>${inline(l.slice(n + 1))}</h${n}>`); }
      else if (/^\|/.test(l)) {
        const rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]); i--;
        const cells = (r) => r.split('|').slice(1, -1).map((c) => c.trim());
        out.push('<table><tr>' + cells(rows[0]).map((c) => `<th>${inline(c)}</th>`).join('') + '</tr>' + rows.slice(2).map((r) => '<tr>' + cells(r).map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</table>');
      } else if (/^- /.test(l)) { const it = []; while (i < lines.length && /^- /.test(lines[i])) it.push(lines[i++].slice(2)); i--; out.push('<ul>' + it.map((t) => `<li>${inline(t)}</li>`).join('') + '</ul>'); }
      else if (l.trim()) { const p = [l]; while (i + 1 < lines.length && lines[i + 1].trim() && !/^(#|\||- )/.test(lines[i + 1])) p.push(lines[++i]); out.push(`<p>${inline(p.join(' '))}</p>`); }
    }
    return linkFiles(out.join(''));
  }
  fetch('legal/' + doc).then((r) => (r.ok ? r.text() : Promise.reject())).then((t) => {
    box.innerHTML = doc.endsWith('.md') ? md(t) : `<h1>${esc(doc.replace(/\.(txt|md)$/, '').replace(/-/g, ' '))}</h1><pre>${esc(t)}</pre>`;
    document.title = 'Lightbench — ' + (box.querySelector('h1')?.textContent || doc);
  }).catch(() => { box.textContent = 'Could not load this document.'; });
})();
</script>
</body>
</html>
